[project]
name = "context-detection"
version = "0.1.0"
requires-python = ">=3.12"
# TODO(чел.1): зафиксировать версии перед первым общим прогоном.
dependencies = [
    "torch",
    "torchvision",
    "pycocotools",
    "numpy",
    "pillow",
    "matplotlib",
]

[project.optional-dependencies]
# Версия ruff пиновая: она должна совпадать с rev в .pre-commit-config.yaml и
# с version в CI, иначе «локально зелено, в CI красно».
dev = ["pytest", "ruff==0.16.3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "UP",      # pyupgrade
    "B",       # bugbear
]

[tool.ruff.lint.per-file-ignores]
# Заготовки: сигнатуры с неиспользуемыми аргументами — это контракт, не мусор.
"src/context_detection/**" = ["ARG"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
