name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Одна версия на CI, pre-commit и pyproject — иначе «локально зелено, в CI красно».
  RUFF_VERSION: 0.16.3

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/ruff-action@v3
        with:
          version: ${{ env.RUFF_VERSION }}
          args: check --output-format=github
      - uses: astral-sh/ruff-action@v3
        with:
          version: ${{ env.RUFF_VERSION }}
          # ruff форматирует и python-блоки внутри .md, поэтому TODO.md тоже
          # проходит проверку. Схемы полей, не являющиеся кодом, помечать ```text.
          args: format --check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      # Быстрая линия: конфиги и реестр имён проверяются без torch за секунды.
      - run: pip install pytest pydantic
      - run: pytest -q tests/test_configs.py

      # Контракты стали Pydantic поверх Tensor, поэтому проверить их без torch
      # нельзя. CPU-колёса: GPU не нужен, обычный индекс тянет ~2.5 ГБ CUDA.
      # Именно --index-url, а не --extra-index-url: второй не заменяет PyPI, а
      # добавляется к нему, и pip всё равно резолвит CUDA-сборку по версии.
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: pytest -q
