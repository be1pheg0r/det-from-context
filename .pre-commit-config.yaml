# Установка (один раз на клон):
#   pip install -e ".[dev]" && pre-commit install --install-hooks
# Обычные Ruff hooks используют собственное окружение. Pre-push hooks ниже
# намеренно запускают Ruff из проектной .venv, чтобы версия совпадала с dev
# зависимостями и не зависела от глобального Python.
#
# ⚠️ Локальный хук обходится через `git commit --no-verify`. Настоящее
# принуждение — job `lint` в .github/workflows/ci.yml плюс branch protection
# на develop. Хук здесь для того, чтобы не гонять CI ради опечатки.
minimum_pre_commit_version: "3.2.0"
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
fail_fast: true

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Должно совпадать с ruff== в pyproject.toml и version в ci.yml.
    rev: v0.16.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        # Веса RF-DETR и куски датасета в git не кладём.
        args: [--maxkb=5000]

  - repo: local
    hooks:
      - id: ruff-check-pre-push
        name: ruff check (pre-push)
        entry: .venv/Scripts/python.exe -m ruff check .
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: ruff-format-pre-push
        name: ruff format check (pre-push)
        entry: .venv/Scripts/python.exe -m ruff format --check .
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: pytest-pre-push
        name: pytest (pre-push)
        entry: python -m pytest -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
