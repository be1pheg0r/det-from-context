name: image_dataloader

dataset:
  # These are independent locations: images and BDD100K JSON annotations do
  # not have to share a parent directory.  DataSphere supplies both values.
  images_dir: ${oc.env:IMAGE_DATASET_IMAGES_DIR,../out/images_test_2}
  annotations_dir: ${oc.env:IMAGE_DATASET_ANNOTATIONS_DIR,../out/labels3}

  # Максимальное разрешение изображения.
  # Если исходное изображение больше, оно будет уменьшено
  # с сохранением пропорций.
  image_size:
    width: 1280
    height: 720
  patch_size: 16
  num_windows: 2
  multi_scale: false

  # Расширения файлов изображений, которые обрабатываем
  image_extensions:
    - ".jpg"
    - ".jpeg"
    - ".png"

# A deterministic split lets the original single-directory dataset be used for
# a training smoke run without duplicating images. Override paths through the
# environment on Datasphere (IMAGE_DATASET_IMAGES_DIR and
# IMAGE_DATASET_ANNOTATIONS_DIR) or edit these two paths for a local run.
splits:
  train_fraction: 0.8


dataloader:
  batch_size: 1
  shuffle: true
  num_workers: 4

  # Если True — возвращать target для каждого изображения
  return_targets: true


classes:
  # Соответствие category из JSON -> числовой class_id

  'traffic light': 0
  'traffic sign': 1
  'car': 2
  'area/drivable': 3
  'lane/road curb': 4
  'person': 5
  'area/alternative': 6
  'lane/single white': 7
  'lane/double yellow': 8
  'bus': 9
  'truck': 10
  'lane/single yellow': 11
  'lane/crosswalk': 12
  'rider': 13
  'bike': 14
  'lane/double white': 15
  'motor': 16
  'train': 17
  'lane/single other': 18
  'lane/double other': 19
