defaults:
  - _self_

name: synthetic-linear-regression

data:
  name: synthetic_regression
  component_path: datasets/synthetic_regression
  config_path: datasets/synthetic_regression/config.yaml
  root: null
  context_k: 0
  context_strategy: empty
  clip_len: 1
  image_size: 1
  augmentations: []

detector:
  name: linear_regression
  component_path: models/linear_regression
  config_path: models/linear_regression/config.yaml
  variant: linear
  weights: null
  freeze_backbone: false
  freeze_decoder: false
  num_queries: 1
  dim: 1
  num_classes: 1
  num_heads: 1
  num_decoder_layers: 1

context:
  name: none
  fusion: residual
  num_slots: 0
  memory_length: 1
  short_memory_length: 1
  write_threshold: 0.5
  max_missed: 0
  association_iou_threshold: 0.1
  association_cosine_threshold: 0.5
  association_appearance_weight: 0.25
  motion_momentum: 0.8
  write_gate: false
  motion: null
  horizon: 0

train:
  epochs: 100
  lr: 0.05
  batch_size: 32
  grad_accum: 1
  optimizer: adamw
  weight_decay: 0.0
  num_workers: 0
  seed: 42
  amp: false
  denoising: false
  detach_state: true

validation:
  metrics:
    - mse
  every_n_epochs: 10
  batch_size: 64

logging:
  level: INFO
  every_n_steps: 10

output:
  root: outputs
  checkpoint_every_n_epochs: 100
  keep_last_checkpoints: 1
  save_best: true
  monitor: mse

clearml:
  enabled: true
  project_name: context-detection/regression-smoke
  tags:
    - protocol-validation
    - synthetic-regression
