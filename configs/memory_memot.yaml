defaults:
  - _base_
  - _self_

# MeMOT: short/long-term temporal memory with recurrent DMAT aggregation.
data:
  clip_len: 8
context:
  name: memot
  fusion: gated_residual
  num_slots: 300
  memory_length: 24
  short_memory_length: 3
  write_threshold: 0.5
  max_missed: 24
  association_iou_threshold: 0.1
  association_cosine_threshold: 0.5
  association_appearance_weight: 0.25
  motion_momentum: 0.8
