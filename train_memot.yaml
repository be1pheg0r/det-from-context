name: GPU Train memot
desc: Train memot on 200 epochs with GPU
cmd:  python3 -m  src.train_memot_batch_v6 configs/memory_memot.yaml --video-config datasets/video_dataloader/config.yaml --epochs 200 --batch-size 12 --clearml --save /job/s3/bt17f0k57rfieh6jugr8/outputs/memot.pt --max-samples 5000 --device cuda
env:
  python:
    type: auto
s3-mounts:
  - bt17f0k57rfieh6jugr8
inputs:
  - configs/
  - datasets/video_dataloader/config.yaml
  - models/rfdetr/
cloud-instance-types:
  - g1.1
