name: rfdetr-image-datasphere-smoke
data:
  name: image_dataloader
  component_path: datasets/image_dataloader
  config_path: datasets/image_dataloader/config.yaml
  root: null
  context_k: 0
  context_strategy: empty
  clip_len: 1
  image_size: 704
  augmentations:
  - horizontal_flip
  - color_jitter
detector:
  name: rfdetr
  component_path: models/rfdetr
  config_path: models/rfdetr/config.yaml
  variant: large
  weights: null
  freeze_backbone: true
  freeze_decoder: false
  freeze_encoder: null
  freeze_bbox_embed: false
  freeze_cls_embed: false
  num_queries: 300
  dim: 256
  num_classes: 31
  num_heads: 8
  num_decoder_layers: 3
context:
  name: none
  fusion: residual
  num_slots: 0
  memory_length: 1
  short_memory_length: 1
  write_threshold: 0.5
  max_missed: 1
  association_iou_threshold: 0.1
  association_cosine_threshold: 0.5
  association_appearance_weight: 0.25
  motion_momentum: 0.8
  write_gate: false
  motion: null
  horizon: 0
train:
  epochs: 3
  lr: 0.0001
  batch_size: 32
  grad_accum: 2
  optimizer: adamw
  weight_decay: 0.0001
  warmup_epochs: 2
  head_lr_multiplier: 1.0
  decoder_lr_multiplier: 0.5
  backbone_lr_multiplier: 0.05
  num_workers: 8
  seed: 42
  amp: true
  denoising: false
  detach_state: true
validation:
  metrics:
  - map
  - map_50
  every_n_epochs: 1
  batch_size: 32
logging:
  level: INFO
  every_n_steps: 20
output:
  root: /job/s3/bt17f0k57rfieh6jugr8/rfdetr-image-runs
  checkpoint_every_n_epochs: 1
  keep_last_checkpoints: 2
  save_best: true
  monitor: map
clearml:
  enabled: true
  project_name: context-detection
  tags:
  - rfdetr
  - image-dataloader
  - datasphere
  - smoke
