name: video_dataloader

dataset:
  # Independent roots supplied by DataSphere mounts or environment variables.
  videos_dir: ${oc.env:VIDEO_DATASET_VIDEOS_DIR,data/videos}
  annotations_dir: ${oc.env:VIDEO_DATASET_ANNOTATIONS_DIR,data/annotations}
  annotation_extension: ".json"
  video_extensions: [".mp4", ".mov", ".avi", ".mkv"]
  recursive: true
  strict_pairs: true
  annotation_mode: auto
  target_fps: 5.0
  max_seek_error_ms: 100.0
  auto_rotate: true

  # RF-DETR preprocessing. Resolution is owned by detector.variant.
  patch_size: 16
  num_windows: 2
  multi_scale: false
  expanded_scales: false
  skip_random_resize: false
  scale_jitter: true
  aug_config: null

splits:
  train_names: [train]
  validation_names: [val, validation, valid]
  test_names: [test]

dataloader:
  batch_size: 1
  shuffle: true
  num_workers: 0

classes:
  traffic light: 0
  traffic sign: 1
  car: 2
  person: 3
  bus: 4
  truck: 5
  rider: 6
  bike: 7
  motor: 8
  train: 9
